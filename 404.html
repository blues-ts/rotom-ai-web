<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>River TCG</title>
  <!--
    GitHub Pages catch-all. Shared card links (/card/<id>) normally go through
    the Cloudflare worker (worker/); if they ever land here, send people without
    the app to the App Store. Every other unknown URL goes home.
  -->
  <script>
    location.replace(location.pathname.indexOf("/card/") === 0
      ? "https://apps.apple.com/us/app/river-tcg-card-scanner/id6785658804"
      : "/");
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body></body>
</html>
