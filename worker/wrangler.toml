name = "rivertcg-card-preview"
main = "src/index.js"
compatibility_date = "2026-07-13"

# Intercepts ONLY these paths; the rest of rivertcg.com stays on GitHub Pages.
# Requires the rivertcg.com zone on this Cloudflare account.
#   /card/*  shared-card link previews
#   /api/*   Android waitlist signup (POST /api/waitlist)
routes = [
  { pattern = "rivertcg.com/card/*", zone_name = "rivertcg.com" },
  { pattern = "rivertcg.com/api/*", zone_name = "rivertcg.com" }
]

# Android waitlist emails. Table: schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "river-waitlist"
database_id = "REPLACE_WITH_D1_ID"
